name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-python:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Validate Python syntax
        run: |
          python --version
          python -m compileall src scripts tests

  lint-python:
    runs-on: ubuntu-latest
    needs: validate-python

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run lightweight lint checks
        run: |
          ruff check src scripts tests --select E9,F63,F7,F82

  unit-tests:
    runs-on: ubuntu-latest
    needs: lint-python

    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scikit-learn pytest wfdb
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Run tests
        run: |
          pytest -q