image: python:3.10

stages:
  - validate
  - test

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

cache:
  paths:
    - .cache/pip

before_script:
  - python --version
  - pip install --upgrade pip
  - pip install -r requirements.txt pytest

validate_python:
  stage: validate
  script:
    - python -m compileall scripts src

unit_tests:
  stage: test
  script:
    - pytest -q --junitxml=test-results.xml
  artifacts:
    when: always
    paths:
      - test-results.xml
